<style>
.site-header{
  display:contents;
  --focus:#2b6cb0; --hover:rgba(255,255,255,.3); --active:rgba(15,25,110,.4);
}
.nav-stage{
  position:relative; width:100%; aspect-ratio:507/176;
}
.bar-group{
  position:sticky; top:0; z-index:5;
  width:calc(484/507*100%); aspect-ratio:484/40;
  margin:calc(-53/507*100%) 0 calc(13/507*100% + 24px) calc(12/507*100%);
}
.site-header.stuck .bar-group{ filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.layer{
  position:absolute; inset:0; width:100%; height:100%;
  image-rendering:pixelated; pointer-events:none; user-select:none;
}
.art{ position:absolute; height:auto; image-rendering:pixelated; pointer-events:none; user-select:none; }
.z-avatar, .z-hands{ left:calc(34/507*100%); top:calc(1/176*100%); width:calc(170/507*100%); }
.z-avatar{ z-index:1; }
.z-hands{ z-index:6; transition:transform .07s ease-out, opacity .07s ease-out; }
.site-header.stuck .z-hands{ transform:translateY(-12%); opacity:0; }
.z-bar{ left:0; top:0; width:100%; z-index:1; }
.z-home{ left:0; top:0; width:calc(40/484*100%); z-index:3; }
.z-home-hover{ visibility:hidden; }
.bar-group:has(.c-home:hover, .c-home:focus-visible) .z-home{ visibility:hidden; }
.bar-group:has(.c-home:hover, .c-home:focus-visible) .z-home-hover{ visibility:visible; }
.z-title{ left:calc(215/507*100%); top:calc(25/176*100%); width:calc(78/507*100%); z-index:3; visibility:hidden; }
.z-title.fit{ visibility:visible; }
.z-bubble{ left:calc(171/507*100%); top:calc(11/176*100%); width:calc(299/507*100%); z-index:2; visibility:hidden; }
.z-bubble.fit{ visibility:visible; }

.cell{
  position:absolute; display:flex; align-items:center; justify-content:center;
  top:calc(3/40*100%); height:calc(34/40*100%);
  color:#fff; text-shadow:0 1px 0 rgba(0,0,60,.55); text-decoration:none; font-size:3.6cqw; line-height:1; font-weight:600;
  z-index:2; -webkit-tap-highlight-color:transparent;
}
.cell span{ position:relative; z-index:6; padding-top:.1em; transition:transform .12s steps(2); }
.cell::before{ content:""; position:absolute; inset:0; background:transparent; transition:background .1s; }
.cell:hover::before, .cell:focus-visible::before{ background:var(--hover); }
.cell[aria-current="page"]:not(.c-home)::before{ background:var(--active); }
.cell:active span{ transform:translateY(2px); }
.cell:focus-visible{ outline:2px solid #fff; outline-offset:-3px; }
.c-home{ left:calc(2/484*100%);   width:calc(36/484*100%); }
.c-f1  { left:calc(41/484*100%);  width:calc(145/484*100%); }
.c-f2  { left:calc(189/484*100%); width:calc(146/484*100%); }
.c-f3  { left:calc(338/484*100%); width:calc(144/484*100%); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.title-link{
  position:absolute; z-index:6; left:calc(215/507*100%); top:calc(25/176*100%);
  width:calc(78/507*100%); height:calc(79/176*100%);
}
.title-link:focus-visible{ outline:3px solid var(--focus); }
.z-title{ transform-origin:50% 50%; transition:transform .15s ease-out; }
.title-link:hover ~ .z-title, .title-link:focus-visible ~ .z-title{ transform:scale(1.03); }

.quote{
  position:absolute; z-index:4; left:calc(350/507*100%); top:calc(22/176*100%);
  width:calc(109/507*100%); height:calc(90/176*100%);
  display:flex; align-items:center; font-size:3.3cqw; line-height:1.2;
  margin:0; overflow:hidden; pointer-events:none;
}

.avatar-hit{
  position:absolute; z-index:6; left:calc(52/507*100%); top:calc(10/176*100%);
  width:calc(116/507*100%); height:calc(116/176*100%);
}
.z-avatar{ transition:transform .1s steps(2); }
.avatar-hit:hover ~ .z-avatar{ transform:translateY(-1.2%); }
@media (prefers-reduced-motion: reduce){
  .z-avatar, .z-hands{ transition:none; }
  .z-title, .cell span{ transition:none; }
}
</style>

<nav class="site-header" aria-label="Main">
  <div class="nav-stage">
    <a class="title-link" href="#home"><span class="sr">Alex Ibanez 2D Art (home)</span></a>
    <div class="avatar-hit" aria-hidden="true"></div>

    <img class="art z-avatar" src="images/header/avatar/Port-Ava.png" alt="">
    <img class="art z-bubble" src="images/header/header-quote.png" alt="">
    <img class="art z-title" src="images/header/header-title.png" alt="">
    <img class="art z-hands" src="images/header/avatar/Port-Arms.png" alt="">

    <p class="quote" id="quote" aria-live="polite">Example quote.</p>
  </div>

  <div class="bar-group">
    <img class="art z-bar" src="images/header/Navabr.png" alt="">
    <img class="art z-home" src="images/header/header-home1.png" alt="">
    <img class="art z-home z-home-hover" src="images/header/header-home2.png" alt="">

    <a class="cell c-home" href="../index.html"><span class="sr">Home</span></a>
    <a class="cell c-f1"   href="#projects"><span>Projects</span></a>
    <a class="cell c-f2"   href="#resume"><span>Resume</span></a>
    <a class="cell c-f3"   href="#contact"><span>Contact</span></a>
  </div>
</nav>
